name: CI

on:
  push:
    branches:
      - main
      - modernize-python314
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: profiles_db
          POSTGRES_USER: profiles_user
          POSTGRES_PASSWORD: profiles_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profiles_user -d profiles_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check .
      - name: Run pip-audit
        run: |
          pip-audit
      - name: Run Django checks
        working-directory: src/profiles_project
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
          POSTGRES_DB: profiles_db
          POSTGRES_USER: profiles_user
          POSTGRES_PASSWORD: profiles_dev_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          python manage.py check

      - name: Run tests
        working-directory: src/profiles_project
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
          POSTGRES_DB: profiles_db
          POSTGRES_USER: profiles_user
          POSTGRES_PASSWORD: profiles_dev_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          python manage.py test
