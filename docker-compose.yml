services:
  db:
    image: postgres:18
    container_name: profiles-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  web:
    build: .
    image: profiles-rest-api:latest
    container_name: profiles-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db

    volumes:
      - ./src/profiles_project/logs:/app/logs

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: profiles-elasticsearch
    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    ports:
      - "127.0.0.1:9200:9200"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20


  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: profiles-kibana
    restart: unless-stopped

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=change-this-to-a-long-random-string-at-least-32-characters

    depends_on:
      elasticsearch:
        condition: service_healthy

    ports:
      - "127.0.0.1:5601:5601"


  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.5.3
    container_name: profiles-elastic-agent
    restart: unless-stopped

    user: root

    # Important: makes ELASTIC_PASSWORD available
    # inside the Elastic Agent container.
    env_file:
      - .env

    volumes:
      - ./elastic-agent/elastic-agent.yml:/usr/share/elastic-agent/elastic-agent.yml:ro
      - ./src/profiles_project/logs:/var/log/django:ro

    depends_on:
      elasticsearch:
        condition: service_healthy


volumes:
  postgres_data:
  elasticsearch_data: