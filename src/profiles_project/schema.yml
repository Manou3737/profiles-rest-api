components:
  schemas:
    AccountStatus:
      type: object
      description: Serializer for account activation and deactivation.
      properties:
        is_active:
          type: boolean
      required:
      - is_active
    AuthToken:
      type: object
      description: Serializes the user authentication credentials.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Hello:
      type: object
      description: Serializes a name field for testing our APIView.
      properties:
        name:
          type: string
          maxLength: 10
      required:
      - name
    PaginatedProfileFeedItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProfileFeedItem'
    PaginatedUserProfileUpdateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileUpdate'
    PasswordChange:
      type: object
      description: |-
        Validate the old password, new password confirmation,
        and password strength policy.
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
      required:
      - new_password
      - new_password_confirm
      - old_password
    PasswordResetConfirm:
      type: object
      description: Serializes password reset confirmation.
      properties:
        new_password:
          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
        uid:
          type: string
        token:
          type: string
      required:
      - new_password
      - new_password_confirm
      - token
      - uid
    PasswordResetRequest:
      type: object
      description: Serializes password reset requests.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PatchedAccountStatus:
      type: object
      description: Serializer for account activation and deactivation.
      properties:
        is_active:
          type: boolean
    PatchedHello:
      type: object
      description: Serializes a name field for testing our APIView.
      properties:
        name:
          type: string
          maxLength: 10
    PatchedProfileFeedItem:
      type: object
      description: A serializer for profile feed items.
      properties:
        id:
          type: integer
          readOnly: true
        user_profile:
          type: integer
          readOnly: true
        status_text:
          type: string
          maxLength: 255
        created_on:
          type: string
          format: date-time
          readOnly: true
    PatchedUserProfileUpdate:
      type: object
      description: Serializer for updating a user profile.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          maxLength: 255
        email_verified:
          type: boolean
          readOnly: true
    ProfileFeedItem:
      type: object
      description: A serializer for profile feed items.
      properties:
        id:
          type: integer
          readOnly: true
        user_profile:
          type: integer
          readOnly: true
        status_text:
          type: string
          maxLength: 255
        created_on:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_on
      - id
      - status_text
      - user_profile
    UserProfile:
      type: object
      description: A serializer for our user profile objects.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 255
        name:
          type: string
          maxLength: 255
        password:
          type: string
          writeOnly: true
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - name
      - password
      - password_confirm
    UserProfileUpdate:
      type: object
      description: Serializer for updating a user profile.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          maxLength: 255
        email_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - email_verified
      - id
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
