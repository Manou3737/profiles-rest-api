        schema:
          type: integer
        description: A unique integer value identifying this user profile.
        required: true
      tags:
      - profile
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileUpdate'
          description: ''
    put:
      operationId: profile_update
      description: Handles creating and updating profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user profile.
